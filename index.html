<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사주 · 점성술 통합 분석</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>사주 · 점성술 통합 분석</h1>
      <p class="lead">
        이름, 생년월일, 태어난 시, 성별을 입력하면 실제 분석 결과를 바로 받아볼 수 있어요.
        개인정보는 분석 응답 생성 용도로만 사용하며 별도 저장하지 않습니다.
      </p>

      <form id="fortune-form" class="card">
        <div class="grid">
          <label>이름<input name="name" required /></label>
          <label>성별
            <select name="gender" required>
              <option value="">선택</option>
              <option>여성</option>
              <option>남성</option>
              <option>기타</option>
            </select>
          </label>
          <label>생년월일<input name="birthDate" type="date" required /></label>
          <label>태어난 시각<input name="birthTime" type="time" required /></label>
          <label>출생지(선택)
            <input name="birthPlace" placeholder="예: 서울" />
          </label>
          <label>만세력/점성술 참고 데이터(선택)
            <input name="reference" placeholder="예: 일주, 대운, 세운, 별자리 배치" />
          </label>
        </div>

        <label class="full">추가 요청사항(선택)
          <textarea name="extra" rows="3" placeholder="궁금한 분야나 강조할 점"></textarea>
        </label>

        <div class="actions">
          <button type="submit" id="analyze-btn">분석 시작</button>
          <button type="button" id="clear-btn">초기화</button>
        </div>
      </form>

      <section class="card">
        <h2>분석 결과</h2>
        <pre id="result-output">아직 분석되지 않았습니다.</pre>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
