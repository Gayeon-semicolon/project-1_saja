<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>사주 · 점성술 통합 리딩</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>사주 · 점성술 통합 리딩</h1>
      <p class="lead">
        이름, 생년월일, 태어난 시, 성별을 입력하면 사주/점성술 통합 분석 요청문을 자동으로 만들어요.
        입력한 개인정보는 브라우저 안에서만 사용되고 저장하지 않습니다.
      </p>

      <form id="fortune-form" class="card">
        <div class="grid">
          <label>이름<input name="name" required /></label>
          <label>성별
            <select name="gender" required>
              <option value="">선택</option>
              <option>여성</option>
              <option>남성</option>
              <option>기타</option>
            </select>
          </label>
          <label>생년월일<input name="birthDate" type="date" required /></label>
          <label>태어난 시각<input name="birthTime" type="time" required /></label>
          <label>출생지(선택)
            <input name="birthPlace" placeholder="예: 서울" />
          </label>
          <label>만세력/점성술 참고 데이터(선택)
            <input name="reference" placeholder="예: 일주, 대운, 세운, 별자리 배치" />
          </label>
        </div>

        <label class="full">추가 요청사항(선택)
          <textarea name="extra" rows="3" placeholder="궁금한 분야나 강조할 점"></textarea>
        </label>

        <div class="actions">
          <button type="submit">분석 프롬프트 만들기</button>
          <button type="button" id="copy-btn">프롬프트 복사</button>
          <button type="button" id="clear-btn">초기화</button>
        </div>
      </form>

      <section class="card">
        <h2>생성된 분석 프롬프트</h2>
        <pre id="prompt-output">아직 생성되지 않았습니다.</pre>
      </section>

      <section class="card notice">
        <h3>사용 방법</h3>
        <ol>
          <li>폼 입력 후 <strong>분석 프롬프트 만들기</strong>를 누르세요.</li>
          <li>복사한 프롬프트를 원하는 AI(예: ChatGPT)에 붙여넣어 분석을 받으세요.</li>
          <li>개인정보는 서버에 저장하지 않으며, 새로고침하면 사라집니다.</li>
        </ol>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
